name: Signaler un problème
description: Décrire un bug reproductible dans FLUXO
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: "Merci de vérifier qu'aucune information personnelle ou secrète n'est incluse. Ne publie pas de vulnérabilité de sécurité ici."
  - type: input
    id: version
    attributes:
      label: Version de FLUXO
      placeholder: "Prototype 0.1.0"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Plateforme et version du système
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Résultat attendu
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Résultat obtenu
    validations:
      required: true
